<svg xmlns="http://www.w3.org/2000/svg" width="760" height="990" viewBox="0 0 760 990" role="img" aria-labelledby="title desc"><title id="title">家庭异地组网与代理架构</title><desc id="desc">Hub 负责控制协调和 DERP，Edge 与 Out 承担海外访问，NAS 连接 Mesh 与家庭 LAN；P2P 不经 Hub 数据转发。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="760" height="990" rx="20" fill="#f8fafc"/><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a"><rect x="190" y="30" width="380" height="90" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="380" y="59" font-size="21" font-weight="700" text-anchor="middle">Android / iOS</text><text x="380" y="85" font-size="16" fill="#334155" text-anchor="middle">sing-box：TUN + 代理 + Mesh</text><rect x="160" y="177" width="440" height="110" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="380" y="206" font-size="21" font-weight="700" text-anchor="middle">Hub</text><text x="380" y="232" font-size="16" fill="#334155" text-anchor="middle">Headscale 0.29.5 · DERP/STUN</text><text x="380" y="254" font-size="16" fill="#334155" text-anchor="middle">Caddy · 订阅发布</text><line x1="380" y1="120" x2="380" y2="172" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/><text x="547" y="148" font-size="15" fill="#475569" text-anchor="middle">注册 / 控制面</text><rect x="32" y="368" width="328" height="100" rx="14" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/><text x="196" y="397" font-size="21" font-weight="700" text-anchor="middle">Edge 代理入口</text><text x="196" y="423" font-size="16" fill="#334155" text-anchor="middle">sing-box / s-ui · 海外常规出口</text><rect x="402" y="368" width="328" height="100" rx="14" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/><text x="566" y="397" font-size="21" font-weight="700" text-anchor="middle">Out 家宽出口</text><text x="566" y="423" font-size="16" fill="#334155" text-anchor="middle">部分 AI 服务落地出口</text><line x1="210" y1="120" x2="185" y2="363" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><text x="104" y="264" font-size="16" fill="#475569" text-anchor="middle">海外代理</text><line x1="360" y1="419" x2="399" y2="419" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><text x="381" y="395" font-size="14" fill="#475569" text-anchor="middle">分流</text><rect x="190" y="562" width="380" height="95" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="380" y="591" font-size="21" font-weight="700" text-anchor="middle">Z2Pro NAS</text><text x="380" y="617" font-size="16" fill="#334155" text-anchor="middle">Docker Tailscale · 子网路由</text><line x1="510" y1="120" x2="526" y2="555" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><text x="625" y="326" font-size="16" fill="#475569" text-anchor="middle">家庭 Mesh P2P</text><line x1="380" y1="290" x2="380" y2="554" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/><text x="306" y="530" font-size="14" fill="#475569" text-anchor="middle">DERP 回退</text><line x1="380" y1="658" x2="380" y2="706" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="78" y="706" width="604" height="227" rx="14" fill="#ecfccb" stroke="#bef264" stroke-width="2"/><text x="380" y="735" font-size="21" font-weight="700" text-anchor="middle">家庭 LAN（示例：家庭 LAN）</text><text x="380" y="761" font-size="16" fill="#334155" text-anchor="middle"></text><rect x="108" y="776" width="253" height="111" rx="14" fill="#ffffff" stroke="#a3e635" stroke-width="2"/><text x="234.5" y="805" font-size="18" font-weight="700" text-anchor="middle">开发机</text><text x="234.5" y="831" font-size="16" fill="#334155" text-anchor="middle">sing-box 本机 / LAN 代理</text><rect x="397" y="776" width="253" height="111" rx="14" fill="#ffffff" stroke="#a3e635" stroke-width="2"/><text x="523.5" y="805" font-size="18" font-weight="700" text-anchor="middle">部署机</text