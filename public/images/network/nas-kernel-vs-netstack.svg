<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" role="img" aria-labelledby="title desc"><title id="title">NAS 子网路由的两种转发模式</title><desc id="desc">内核模式保留端到端 IP 包并依赖 Linux 路由/NAT；用户态模式由 netstack 重建 TCP UDP 连接。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="700" height="650" rx="20" fill="#f8fafc"/><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a"><rect x="33" y="35" width="634" height="70" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="350" y="64" font-size="19" font-weight="700" text-anchor="middle">远端手机 → Tailscale / WireGuard 加密流量</text><line x1="350" y1="105" x2="350" y2="144" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="32" y="146" width="303" height="90" rx="14" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/><text x="183.5" y="175" font-size="21" font-weight="700" text-anchor="middle">内核态 TUN</text><text x="183.5" y="201" font-size="16" fill="#334155" text-anchor="middle">解密后交给 Linux 网络栈</text><rect x="366" y="146" width="303" height="90" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="517.5" y="175" font-size="21" font-weight="700" text-anchor="middle">用户态 Netstack</text><text x="517.5" y="201" font-size="16" fill="#334155" text-anchor="middle">进程内处理 TCP / UDP</text><line x1="177" y1="236" x2="177" y2="284" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><line x1="517" y1="236" x2="517" y2="284" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="32" y="286" width="303" height="135" rx="14" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/><text x="183.5" y="315" font-size="21" font-weight="700" text-anchor="middle">L3 IP 转发</text><text x="183.5" y="341" font-size="16" fill="#334155" text-anchor="middle">路由 / FORWARD / NAT</text><text x="183.5" y="363" font-size="16" fill="#334155" text-anchor="middle">依赖内核与防火墙能力</text><rect x="366" y="286" width="303" height="135" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="517.5" y="315" font-size="21" font-weight="700" text-anchor="middle">L4 连接重建</text><text x="517.5" y="341" font-size="16" fill="#334155" text-anchor="middle">NAS 新建目标 TCP/UDP 连接</text><text x="517.5" y="363" font-size="16" fill="#334155" text-anchor="middle">绕开对应的内核转发路径</text><line x1="177" y1="421" x2="177" y2="467" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><line x1="517" y1="421" x2="517" y2="467" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="32" y="469" width="303" height="108" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="183.5" y="498" font-size="21" font-weight="700" text-anchor="middle">家庭 LAN 服务</text><text x="183.5" y="524" font-size="16" fill="#334155" text-anchor="middle">端到端 IP 包语义保留</text><rect x="366" y="469" width="303" height="108" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="517.5" y="498" font-size="21" font-weight="700" text-anchor="middle">家庭 LAN 服务</text><text x="517.5" y="524" font-size="16" fill="#334155" text-anchor="middle">TCP/UDP 代理，协议有限制</text><text x="350" y="620" font-size="17" fill="#475569" text-anchor="middle">两种模式都可以使用 WireGuard P2P；区别主要在解密后的转发层</text></g></svg>