<svg xmlns="http://www.w3.org/2000/svg" width="700" height="690" viewBox="0 0 700 690" role="img" aria-labelledby="title desc"><title id="title">IPv4 IPv6 直连与 DERP 回退</title><desc id="desc">STUN 发现候选路径，手机与 NAS 尝试 UDP P2P，失败才回退自建 DERP；控制平面并非所有流量必经。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="700" height="690" rx="20" fill="#f8fafc"/><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a"><rect x="177" y="28" width="346" height="85" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="350" y="57" font-size="21" font-weight="700" text-anchor="middle">手机 / Android</text><text x="350" y="83" font-size="16" fill="#334155" text-anchor="middle">Tailscale 对端</text><rect x="177" y="553" width="346" height="92" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="350" y="582" font-size="21" font-weight="700" text-anchor="middle">Z2Pro NAS</text><text x="350" y="608" font-size="16" fill="#334155" text-anchor="middle">家庭 LAN 的子网路由</text><rect x="27" y="220" width="286" height="119" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="170" y="249" font-size="19" font-weight="700" text-anchor="middle">IPv4 / IPv6 UDP P2P</text><text x="170" y="275" font-size="16" fill="#334155" text-anchor="middle">可达时直接传 WireGuard</text><text x="170" y="297" font-size="16" fill="#334155" text-anchor="middle">IPv6 能减少 NAT 障碍</text><rect x="387" y="220" width="286" height="119" rx="14" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/><text x="530" y="249" font-size="19" font-weight="700" text-anchor="middle">Tokyo DERP</text><text x="530" y="275" font-size="16" fill="#334155" text-anchor="middle">直连不可用时兜底中继</text><text x="530" y="297" font-size="16" fill="#334155" text-anchor="middle">仍传 WireGuard 密文</text><line x1="282" y1="113" x2="170" y2="214" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><line x1="418" y1="113" x2="530" y2="214" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/><line x1="170" y1="343" x2="282" y2="547" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><line x1="530" y1="343" x2="418" y2="547" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/><rect x="218" y="388" width="264" height="96" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="350" y="417" font-size="19" font-weight="700" text-anchor="middle">STUN / netcheck</text><text x="350" y="443" font-size="16" fill="#334155" text-anchor="middle">探测公网候选地址</text><text x="350" y="465" font-size="16" fill="#334155" text-anchor="middle">成功 ≠ 已经端到端直连</text><text x="350" y="676" font-size="17" fill="#475569" text-anchor="middle">以实际 direct [IPv6]:port 为直连证据</text></g></svg>