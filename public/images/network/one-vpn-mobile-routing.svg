<svg xmlns="http://www.w3.org/2000/svg" width="660" height="865" viewBox="0 0 660 865" role="img" aria-labelledby="title desc"><title id="title">单 VPN 手机侧流量分流</title><desc id="desc">单个 sing-box TUN 按家庭 Wi-Fi 与目的地规则选择局域网直连、Tailnet、国内直连和海外代理。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="660" height="865" rx="20" fill="#f8fafc"/><g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#0f172a"><rect x="180" y="28" width="300" height="78" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="330" y="57" font-size="21" font-weight="700" text-anchor="middle">手机应用</text><text x="330" y="83" font-size="16" fill="#334155" text-anchor="middle">网页、NAS、业务服务</text><line x1="330" y1="106" x2="330" y2="144" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="180" y="145" width="300" height="82" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="330" y="174" font-size="21" font-weight="700" text-anchor="middle">sing-box TUN</text><text x="330" y="200" font-size="16" fill="#334155" text-anchor="middle">手机上唯一的 VPN 入口</text><line x1="330" y1="227" x2="330" y2="263" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="165" y="264" width="330" height="86" rx="14" fill="#fef9c3" stroke="#fde68a" stroke-width="2"/><text x="330" y="293" font-size="21" font-weight="700" text-anchor="middle">路由与 DNS 判断</text><text x="330" y="319" font-size="16" fill="#334155" text-anchor="middle">SSID / 目的 IP / 域名规则</text><line x1="330" y1="350" x2="330" y2="390" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="24" y="394" width="292" height="110" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="170" y="423" font-size="21" font-weight="700" text-anchor="middle">家庭 Wi-Fi</text><text x="170" y="449" font-size="16" fill="#334155" text-anchor="middle">192.168.31.0/24 → LAN 直连</text><rect x="344" y="394" width="292" height="110" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="490" y="423" font-size="21" font-weight="700" text-anchor="middle">异地网络</text><text x="490" y="449" font-size="16" fill="#334155" text-anchor="middle">家庭子网 → Tailscale Endpoint</text><line x1="170" y1="504" x2="170" y2="556" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><line x1="490" y1="504" x2="490" y2="556" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="24" y="558" width="292" height="90" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="170" y="587" font-size="21" font-weight="700" text-anchor="middle">家庭设备</text><text x="170" y="613" font-size="16" fill="#334155" text-anchor="middle">本地物理 LAN</text><rect x="344" y="558" width="292" height="90" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="490" y="587" font-size="21" font-weight="700" text-anchor="middle">NAS 子网路由</text><text x="490" y="613" font-size="16" fill="#334155" text-anchor="middle">WireGuard P2P / DERP 兜底</text><line x1="330" y1="350" x2="330" y2="688" stroke="#64748b" stroke-width="3"  marker-end="url(#arr)"/><rect x="24" y="711" width="292" height="110" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="170" y="740" font-size="21" font-weight="700" text-anchor="middle">国内网络</text><text x="170" y="766" font-size="16" fill="#334155" text-anchor="middle">规则命中 → 直连</text><rect x="344" y="711" width="292" height="110" rx="14" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/><text x="490" y="740" font-size="21" font-weight="700" text-anchor="middle">海外网络</text><text x="490" y="766" font-size="16" fill="#334155" text-anchor="middle">Edge 代理 / 指定 AI → Out</text><text x="330" y="677" font-size="16" fill="#475569" text-anchor="middle">非家庭目标继续匹配国内 / 海外规则</text></g></svg>