name: Format preview layout (temporary)
on:
  push:
    branches: [feat/blog-launch-post-preview]
    paths: [".github/workflows/format-preview-layout.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-launch-post-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "src/pages/posts/[...slug]/index.astro" "src/pages/posts/[...slug]/_components/ShareLinks.astro"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/pages/posts/[...slug]/index.astro" "src/pages/posts/[...slug]/_components/ShareLinks.astro"
          if ! git diff --cached --quiet; then
            git commit -m "style: format article layout and sharing"
            git push origin HEAD:feat/blog-launch-post-preview
          fi
