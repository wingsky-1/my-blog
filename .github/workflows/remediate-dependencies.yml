name: Dependency remediation (PR branch only)

on:
  push:
    branches: [chore/zh-cn-security-ci]
    paths:
      - ".github/workflows/remediate-dependencies.yml"

permissions:
  contents: write

jobs:
  remediate:
    if: github.repository == 'wingsky-1/my-blog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/zh-cn-security-ci
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Update vulnerable versions in lockfile
        run: pnpm audit --fix=update
      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run format:check
          pnpm run build
          pnpm audit --audit-level high
      - name: Commit verified dependency changes
        run: |
          if ! git diff --quiet -- package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json pnpm-lock.yaml pnpm-workspace.yaml
            git commit -m "fix(deps): update audited dependencies"
            git push origin HEAD:chore/zh-cn-security-ci
          fi
