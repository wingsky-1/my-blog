name: Format preview PR (temporary)
on:
  push:
    branches: [feat/blog-launch-post-preview]
    paths:
      - ".github/workflows/format-preview.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-launch-post-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/content/posts/ai/chatgpt-web-blog-setup.md "src/pages/posts/[...slug]/index.astro" src/utils/getReadingStats.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ai/chatgpt-web-blog-setup.md "src/pages/posts/[...slug]/index.astro" src/utils/getReadingStats.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format preview article and reading stats"
            git push origin HEAD:feat/blog-launch-post-preview
          fi
